name: Teste Amazon
on:
  push:
    branches: [amazon-teste]
jobs:
  t:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          cat > t.mjs <<'JS'
          const r = await fetch("https://www.amazon.com.br/dp/B0G7MDQ8G5", { headers: { "user-agent": "facebookexternalhit/1.1", "accept-language": "pt-BR" } });
          const h = await r.text();
          for (const k of ["a-price-whole", "priceAmount", "a-offscreen", "corePrice", "apex_desktop", "priceToPay", "displayPrice"]) {
            let i = -1, n = 0; const idx = [];
            while ((i = h.indexOf(k, i + 1)) >= 0 && n < 3) { idx.push(i); n++; }
            console.log("==", k, (h.split(k).length - 1));
            for (const j of idx) console.log("   ", JSON.stringify(h.slice(j - 80, j + 160)));
          }
          JS
          node t.mjs
