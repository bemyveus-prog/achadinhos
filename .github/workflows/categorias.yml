name: Produtos por categoria

# Produtos de comissão alta dentro das categorias da Shopee → vitrine (subId categoriasite).
on:
  schedule:
    - cron: "52 9 * * *"   # todo dia ~06:52 (Brasília)
  workflow_dispatch:
    inputs:
      simular:
        description: "Só mostrar o que gravaria (não grava nada)"
        type: boolean
        default: false

concurrency:
  group: categorias
  cancel-in-progress: false

jobs:
  categorias:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: automacao
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CATEGORIAS_IDS: ${{ vars.CATEGORIAS_IDS }}
      POR_CATEGORIA: ${{ vars.POR_CATEGORIA }}
      CAT_MIN_COMISSAO: ${{ vars.CAT_MIN_COMISSAO }}
      CAT_MIN_NOTA: ${{ vars.CAT_MIN_NOTA }}
      CAT_MIN_VENDAS: ${{ vars.CAT_MIN_VENDAS }}
      DIAS_NA_VITRINE: ${{ vars.DIAS_NA_VITRINE }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automacao/package-lock.json
      - run: npm ci
      - run: node categorias.mjs ${{ inputs.simular && '--simular' || '' }}
